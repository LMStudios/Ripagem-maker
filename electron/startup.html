<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Ripagem Maker Electron</title>
<style>body{margin:0;background:#101114;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(620px,85vw)}small{color:#8abaff}h1{font-size:36px;letter-spacing:-1px}p{color:#b6b7c0;line-height:1.6}progress{width:100%;accent-color:#3795ff}button{background:#2879df;color:white;border:0;border-radius:10px;padding:13px 20px;margin:12px 8px 0 0;font:inherit;cursor:pointer}.secondary{background:#292c33}code{overflow-wrap:anywhere}</style>
<main><small>RIPAGEM MAKER · ELECTRON</small><h1 id="title">Preparando seu espaço de edição</h1><p id="message">Iniciando o processamento local. Seus trabalhos e suas chaves permanecem no computador.</p><progress id="progress"></progress><div id="actions" hidden><button id="retry">Tentar novamente</button><button class="secondary" id="logs">Abrir pasta de diagnóstico</button></div><p id="detail"></p></main>
<script>const q=new URLSearchParams(location.search);if(q.has('error')){document.getElementById('title').textContent='Não foi possível iniciar';document.getElementById('message').textContent=q.get('error');document.getElementById('progress').hidden=true;document.getElementById('actions').hidden=false}document.getElementById('retry').onclick=()=>window.ripagemDesktop.restart();document.getElementById('logs').onclick=async()=>{const r=await window.ripagemDesktop.logs();if(!r.ok)document.getElementById('detail').textContent=r.erro};</script></html>
